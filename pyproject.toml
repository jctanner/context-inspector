[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "context-inspector"
version = "0.1.0"
description = "Local browser interface for inspecting Claude model context"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "ptyprocess>=0.7,<1",
    "pydantic>=2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "websockets>=13,<16",
]
proxy = [
    "mitmproxy>=12,<13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true
